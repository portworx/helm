---
# Source: portworx/templates/storage-cluster.yaml
kind: StorageCluster
apiVersion: core.libopenstorage.org/v1
metadata:
  name: "mycluster"
  namespace: portworx
  annotations:
  labels:
    heritage: "Helm"
    release: "my-release"
    chart: "portworx-10.2.0"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/instance: "my-release"
spec:
  image: portworx/oci-monitor:3.7.1.1
  imagePullPolicy: Always

  kvdb:
    internal: true
    enableTLS: true
  certManager:
    enabled: true
  storage:
    useAll: true
  secretsProvider: k8s
  
  stork:
    enabled: true
  monitoring:
    telemetry:
      enabled: true
      metricsCollector:
        enabled: true
  csi:
    enabled: true
  autopilot:
    enabled: true
  clusterDiags:
    enabled: true
  platformAgent:
    enabled: true
    image: portworx/platform-agent:1.0.0
    ui:
      enabled: true
      image: portworx/observability-ui:1.0.0
