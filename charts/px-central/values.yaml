    tag: 3.2.0-fc1
    module: pxCentral
  keycloakBackendImage:
    imageName: postgresql
    tag: "18.4"
    module: pxCentral
  keycloakFrontendImage:
    imageName: keycloak
    tag: 26.5.7_v2
    module: pxCentral
  keycloakLoginThemeImage:
