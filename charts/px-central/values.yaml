persistentStorage:
  enabled: true
  storageClassName:
  alertManager:
    storage: 2Gi
  prometheus:
    storage: 64Gi
    retentionSize: 51200MB
  mysqlVolumeSize: "100Gi"
  mongodbVolumeSize: "64Gi"
  mongoCacheSize: 4
  keycloakThemeVolumeSize: "5Gi"
  keycloakBackendVolumeSize: "10Gi"
  preUpgradeHookVolumeSize: "65Gi"
  preInstallHookVolumeSize: "2Gi"
  telemetryVolumeSize: "10Gi"

storkRequired: false
nodeAffinityLabel: ""
podAntiAffinity: false

caCertsSecretName: ""

oidc:
  centralOIDC:
    enabled: true
    defaultUsername: admin
    defaultEmail: admin@portworx.com
    keyCloakBackendUserName: keycloak
    clientId: "pxcentral"
    updateAdminProfile: true

  externalOIDC:
    enabled: false
    clientID:
    clientSecret:
    endpoint:

proxy:
  azureProxyEnabled: false
  ## excludeAzureProxyList: List of services to exclude from Azure proxy configuration (annotations)

  # excludeAzureProxyList:
  # - px-backup-alertmanager
  # - px-backup
  # - pxc-backup-mongodb
  # - prometheus-operator
  # - px-backup-dashboard-prometheus
  # - pre-upgrade-check
  # - pxcentral-apiserver
  # - pxcentral-post-install-hook
  # - pxcentral-keycloak-postgresql
  # - pxcentral-keycloak
  # - pxcentral-lh-middleware
  # - pxcentral-backend
  # - pxcentral-frontend
  # - pxcentral-mysql

  # Example for using set command
  # --set "proxy.excludeAzureProxyList[0]=px-backup","proxy.excludeAzureProxyList[1]=pxcentral-mysql"
  excludeAzureProxyList: []

  ## includeNoProxyList: List of services to include in the noProxy configuration.
  # when this list is empty, noProxy is set to all services

  # includeNoProxyList:
  # - px-backup-alertmanager
  # - px-backup
  # - pxc-backup-mongodb
  # - prometheus-operator
  # - px-backup-dashboard-prometheus
  # - pre-upgrade-check
  # - pxcentral-apiserver
  # - pxcentral-post-install-hook
  # - pxcentral-keycloak-postgresql
  # - pxcentral-keycloak
  # - pxcentral-lh-middleware
  # - pxcentral-backend
  # - pxcentral-frontend
  # - pxcentral-mysql

  # Example for using set command
  # --set "proxy.includeNoProxyList[0]=px-backup"
  includeNoProxyList: []
  httpProxy:
    noProxy: ""
  configSecretName: ""
  http: ""
  https: ""


istio:
  enabled: false
  hostName: ""

linkerd:
  enabled: false

isUpgrade: false
isOpenshift: false
isArgoCD: false

pxbackup:
  enabled: false
  orgName: default
  # obsolete
  callHome: false
  mongoMigration: complete
  livenessProbeInitialDelay: 1800
  prometheus:
    replicas: 2
    retention: 90d
  alertmanager:
    replicas: 2
    retention: 2208h
  nfs:
    enabled: true
  deployDedicatedMonitoringSystem: true
  enableExternalMetricsScraping: false
  prometheusEndpoint: ""
  alertmanagerEndpoint: ""
  prometheusSecretName: ""
  alertmanagerSecretName: ""
  usePxBackupEmailAlertTemplate: true
  monitorBLHealthFrequency: 210m
  enableMonitorBLHealth: false
  backupDeleteWorker: 5
  volDeleteWorker: 5
  backupInfoMetricsBackfillHours: ""
  dashboardMetricsBackfillDays: ""
  version: 3.3.0
  skipValidations: false
  usePlatformRbac: false
  encryptMongoDB: false
  federated: false

# Telemetry configuration for PX-Backup
telemetry:
  enabled: false
  environment: production # Environment: staging or production
  metricsCollector:
    enabled: false
    scrapeInterval: 10  # seconds
  logsCollector:
    enabled: true
    collectionInterval: 3600  # seconds (1 hour)
    # Exclude pods matching these patterns (comma-separated)
    excludePodPatterns: "alertmanager,prometheus,telemetry"

service:
  ## NOTE: On managed cloud platforms a "LoadBalancer" service may create a
  ## public (internet-facing) endpoint unless an internal/private load balancer
  ## annotation is set. For a private admin UI, use "ClusterIP" (access via
  ## kubectl port-forward / private ingress), or keep "LoadBalancer" with your
  ## cloud provider's internal-LB annotation set in pxCentralUIServiceAnnotations.
  pxCentralUIServiceType: "LoadBalancer"
  ## For the current per-cloud internal-LB annotations, see the PX-Backup UI
  ## access docs:
  ## https://docs.portworx.com/portworx-backup-on-prem/install/install/set-up-pxb-operations/ui-access
  pxCentralUIServiceAnnotations: {}
  pxBackupUIServiceType: "LoadBalancer"
  pxBackupUIServiceAnnotations: {}
  pxBackupServiceAnnotations: {}
  ## Optional CIDR allow-lists for the UI LoadBalancer services (defense-in-depth).
  ## Rendered as spec.loadBalancerSourceRanges only when the matching service type
  ## is "LoadBalancer" and the list is non-empty. Support varies by cloud provider /
  ## load-balancer implementation; this is NOT a substitute for an internal LB.
  pxCentralUILoadBalancerSourceRanges: []
  pxBackupUILoadBalancerSourceRanges: []

## Memory settings: These are calculated automatically unless specified otherwise
## To run on environments with little resources (<= 8GB), tune your heap settings:
## maxHeapSize:
## - calculate 1/2 ram and cap to 1024MB
## - calculate 1/4 ram and cap to 8192MB
## - pick the max
## newHeapSize:
## A good guideline is 100 MB per CPU core.
## - min(100 * num_cores, 1/4 * heap size)
##
# maxHeapSize: 4G
# newHeapSize: 800M

clusterDomain: "cluster.local"
operatorToChartUpgrade: false

securityContext:
  runAsUser: 1000
  fsGroup: 1000
  runAsNonRoot: true

## sample toleration while installing from values.yaml
# tolerations:
# - effect: NoSchedule
#   key: key1
#   operator: Exists
#
## sample toleration while setting the param inline
# --set 'tolerations[0].operator=Exists,tolerations[0].effect=NoSchedule,tolerations[0].key=key1'
# ensure toleration param is enclosed with single quotes
tolerations: []

images:
  # Shared registry + repo. To retarget everything (air-gap / mirror) change just these two.
  # Image names and tags are set in templates/_helpers.tpl (px.imageCatalog). Third-party images are
  # retagged public upstream images; their origin and license are listed there and in README.md
  # ("Third-party images"), and must stay documented.
  registry: ""
  repo: ""
  pullSecrets: []
  pullPolicy: Always
  insecureRegistry: false

  pxcentralApiServerImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  pxcentralFrontendImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  pxcentralBackendImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  pxcentralMiddlewareImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  postInstallSetupImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  keycloakBackendImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  keycloakFrontendImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  keycloakLoginThemeImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  keycloakInitContainerImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  mysqlImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  preSetupHookImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  mysqlInitImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx

  ## Images required for enabling px-backup
  pxBackupImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  mongodbImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx

  ## Images required for PX-Backup Telemetry
  telemetryEnvoyImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  telemetryRegistrationImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  telemetryMetricsCollectorImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  telemetryDataCollectorImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  telemetryLogUploadImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx

  ## Images required for enabling px-license-server
  licenseServerImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx

  pxBackupPrometheusImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  pxBackupAlertmanagerImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  pxBackupPrometheusOperatorImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  pxBackupPrometheusConfigReloaderImage:
    registry: pure-artifactory.dev.purestorage.com/px-docker-remote
    repo: portworx
  ## Images required for intermediate Mongo upgrades
  # Retagged from docker.io/bitnami/mongodb (see README.md "Third-party images").
  # mongodbImageMap:
  #   tags:
  #     mongodb5: 5.0.24-debian-11-r20
  #     mongodb6: 6.0.13-debian-11-r21
  #     mongodb7: 7.0.15-debian-12-r2
  #     mongodb8: 8.0.20
  #   module: pxBackup
