{{/* PX-Backup Telemetry RBAC */}}
{{- $pxBackupEnabled := .Values.pxbackup.enabled | default false }}
{{- $telemetryEnabled := .Values.telemetry.enabled | default false }}
{{- if and (eq $pxBackupEnabled true) (eq $telemetryEnabled true) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: px-backup-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: px-backup-telemetry
{{- include "px-central.labels" . | nindent 4 }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: px-backup-telemetry-role
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: px-backup-telemetry
{{- include "px-central.labels" . | nindent 4 }}
rules:
  # Secret access for Pure1 certificates
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
    resourceNames: ["pure-telemetry-certs", "px-backup-telemetry-certs"]
  # Allow creating the secret if it doesn't exist
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Service access for endpoint discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: px-backup-telemetry-role-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: px-backup-telemetry
{{- include "px-central.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: px-backup-telemetry
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: px-backup-telemetry-role
  apiGroup: rbac.authorization.k8s.io
---
# RBAC for Logs Collector
{{- $logsEnabled := .Values.telemetry.logsCollector.enabled | default false }}
{{- if eq $logsEnabled true }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: px-backup-telemetry-logs-collector-role
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: px-backup-telemetry
    app.kubernetes.io/name: logs-collector
{{- include "px-central.labels" . | nindent 4 }}
rules:
  # Pod access for log collection
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # ConfigMap access for pause/resume control (TELEMETRY_COLLECTION_ENABLED)
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["px-backup-config"]
    verbs: ["get"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: px-backup-telemetry-logs-collector-role-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: px-backup-telemetry
    app.kubernetes.io/name: logs-collector
{{- include "px-central.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: px-backup-telemetry-logs-collector
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: px-backup-telemetry-logs-collector-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.isOpenshift }}
---
# OpenShift: grant telemetry SAs an SCC so the pod runs as the edge-envoy image user
# (uid 10001) and can write its rendered cert into the image-baked /config. See PB-16246.
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: px-backup-telemetry-scc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: px-backup-telemetry
{{- include "px-central.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: px-backup-telemetry
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: px-backup-telemetry-logs-collector
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}

