{{/* Setting defaults if they are omitted. */}}
{{- $isOpenshiftCluster := or .Values.isOpenshift (.Capabilities.APIVersions.Has "apps.openshift.io/v1") -}}
{{- $deployDedicatedMonitoringSystem := .Values.pxbackup.deployDedicatedMonitoringSystem }}
{{- $azureProxyEnabled := .Values.proxy.azureProxyEnabled | default false }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pxcentral-post-install-hook
  namespace: {{ .Release.Namespace }}
  labels:
    name: pxcentral-post-install-hook
    app.kubernetes.io/component: pxcentral-post-install-hook
{{- include "px-central.labels" . | nindent 4 }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pxcentral-post-install-hook
  namespace: {{ .Release.Namespace }}
  labels:
    name: pxcentral-post-install-hook
    app.kubernetes.io/component: pxcentral-post-install-hook
{{- include "px-central.labels" . | nindent 4 }}
rules:
  # pxcentral-admin-user / pxcentral-modules / pxcentral-ui-configmap / license & etcd configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "delete"]
  # px-central-admin, pxc-backup-secret, pxcentral-keycloak-http, px-license-secret, px-backup-admin-secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
  # Locate/restart the frontend pod, and "get" is required by kubectl exec
  # (into keycloak / license-server pods) before it can hit pods/exec
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Remove etcd Service/headless-Service when px-backup isn't using etcd
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  # Remove the etcd StatefulSet when px-backup isn't using etcd as its datastore
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/status"]
    verbs: ["get"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pxcentral-post-install-hook
  namespace: {{ .Release.Namespace }}
  labels:
    name: pxcentral-post-install-hook
    app.kubernetes.io/component: pxcentral-post-install-hook
{{- include "px-central.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: pxcentral-post-install-hook
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pxcentral-post-install-hook
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.pxlicenseserver.enabled }}
---
# Node listing is only needed to discover the two license-server HA node endpoints
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Namespace }}-pxcentral-post-install-hook
  labels:
    name: pxcentral-post-install-hook
    app.kubernetes.io/component: pxcentral-post-install-hook
{{- include "px-central.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Namespace }}-pxcentral-post-install-hook
  labels:
    name: pxcentral-post-install-hook
    app.kubernetes.io/component: pxcentral-post-install-hook
{{- include "px-central.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: pxcentral-post-install-hook
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Namespace }}-pxcentral-post-install-hook
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pxcentral-post-install-hook
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
  labels:
    name: pxcentral-post-install-hook
    app.kubernetes.io/component: pxcentral-post-install-hook
{{- include "px-central.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      {{- if and (eq $azureProxyEnabled true) (not (has "pxcentral-post-install-hook" .Values.proxy.excludeAzureProxyList)) }}
      annotations:
        kubernetes.azure.com/no-http-proxy-vars: "true"
      {{- end }}
      labels:
{{- include "px-central.partOfLabel" . | nindent 8 }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              {{- if .Values.nodeAffinityLabel }}
              - key: {{ .Values.nodeAffinityLabel }}
                operator: Exists
              {{- else }}
              - key: pxbackup/enabled
                operator: NotIn
                values:
                - "false"
              {{- end }}
      serviceAccountName: pxcentral-post-install-hook
      {{- if $isOpenshiftCluster}}
      {{- else }}
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
      {{- end }}
      containers:
      - name: pxcentral-post-setup
        image: {{ printf "%s/%s/%s:%s" (default .Values.images.postInstallSetupImage.registry .Values.images.registry) (default .Values.images.postInstallSetupImage.repo .Values.images.repo) .Values.images.postInstallSetupImage.imageName .Values.images.postInstallSetupImage.tag }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: HOME
            value: /tmp
          - name: LOG_LEVEL
            value: INFO
          - name: UPDATE_ADMIN_USER_PROFILE
            value: "{{ .Values.oidc.centralOIDC.updateAdminProfile }}"
          - name: PXC_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- if or (empty .Values.proxy.includeNoProxyList) (has "pxcentral-post-install-hook" .Values.proxy.includeNoProxyList) }}
          {{- include "proxy.proxyEnv" . | nindent 10 }}
          {{- end }}
      {{- if eq $deployDedicatedMonitoringSystem true }}
          - name: DEDICATED_PROMETHEUS
            value: "true"
      {{- else }}
          - name: DEDICATED_PROMETHEUS
            value: "false"
      {{- end }}
          - name: DEPLOYMENT_TYPE
      {{- if or .Release.IsUpgrade .Values.isUpgrade }}
            value: "upgrade"
            {{- else }}
            value: "install"
      {{- end }}
      {{- if .Values.pxbackup.federated }}
          - name: PX_BACKUP_FEDERATED
            value: "true"
      {{- end }}
        command: ["/pxcentral-hook/bin/pxcentral-hook"]
        args: ["--hook=post-install"]
        volumeMounts:
          - mountPath: /tmp
            name: tmp-dir
        {{- if .Values.proxy.configSecretName }}
          - mountPath: /etc/ssl/certs/proxy-ca.pem
            subPath: proxy-ca.pem
            name: proxy-ca-volume
            readOnly: true
        {{- end }}
      {{- if .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- range $sec := .Values.images.pullSecrets }}
        - name: {{ $sec | quote }}
        {{- end }}
      {{- end }}
      restartPolicy: Never
      volumes:
        - name: tmp-dir
          emptyDir: {}
      {{- if .Values.proxy.configSecretName }}
        - name: proxy-ca-volume
          secret:
            items:
            - key: CA
              path: proxy-ca.pem
            optional: true
            secretName: {{ .Values.proxy.configSecretName }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }} 
  backoffLimit: 5
  activeDeadlineSeconds: 2400
