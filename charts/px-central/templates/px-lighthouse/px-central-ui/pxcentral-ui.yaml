{{/* Setting defaults if they are omitted. */}}
{{- $isOpenshiftCluster := or .Values.isOpenshift (.Capabilities.APIVersions.Has "apps.openshift.io/v1") -}}
{{- $azureProxyEnabled := .Values.proxy.azureProxyEnabled | default false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pxcentral-frontend-nginx-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: pxcentral-frontend
{{- include "px-central.labels" . | nindent 4 }}
data:
  default.conf: |
    proxy_send_timeout 300s;
{{- if .Values.istio.enabled }}
    proxy_http_version 1.1;
{{- end }}
    proxy_read_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    client_max_body_size 8M;

    upstream lhBackend {
      server pxcentral-lh-middleware:8091;
    }

    upstream keycloak {
      server pxcentral-keycloak-http:80;
    }


    map $http_x_forwarded_proto $myscheme {
      default $http_x_forwarded_proto;
      ''  $scheme;
    }

    server {
      listen  8080;
      # Below is replaced by frontend.entrypoint.sh to enable IPv6 listening when IPv6 is supported
      #IPV6_LISTEN_PLACEHOLDER
      server_name localhost;
      server_tokens off;
      access_log /var/log/nginx/access.log;
      error_log  /var/log/nginx/error.log;
      location = /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
      }
      location / {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy 'no-referrer';
        add_header X-Frame-Options 'SAMEORIGIN';
        add_header X-Content-Type-Options 'nosniff';
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self';";
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
      }

      location /lhBackend/ {
        proxy_pass http://lhBackend/;
{{- if .Values.istio.enabled }}
        proxy_set_header Host              "pxcentral-lh-middleware";
{{- end }}
      }
      location /auth {
        proxy_pass http://keycloak;
        proxy_cache_bypass  $http_upgrade;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
{{- if .Values.istio.enabled }}
        proxy_set_header Host              "pxcentral-keycloak-http";
{{- else }}
        proxy_set_header Host              $host;
{{- end }}
        proxy_set_header X-Real-IP         $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $myscheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Port  $http_port;
        proxy_set_header X-Forwarded-Port  $http_port;
        proxy_buffer_size 8k;
      }
      error_page 404 =200 /index.html;
      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxcentral-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    run: pxcentral-frontend
    app.kubernetes.io/component: pxcentral-frontend
{{- include "px-central.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      run: pxcentral-frontend
      app.kubernetes.io/component: pxcentral-frontend
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      {{- if and (eq $azureProxyEnabled true) (not (has "pxcentral-frontend" .Values.proxy.excludeAzureProxyList)) }}
      annotations:
        kubernetes.azure.com/no-http-proxy-vars: "true"
      {{- end }}
      labels:
        run: pxcentral-frontend
        app.kubernetes.io/component: pxcentral-frontend
{{- include "px-central.partOfLabel" . | nindent 8 }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              {{- if .Values.nodeAffinityLabel }}
              - key: {{ .Values.nodeAffinityLabel }}
                operator: Exists
              {{- else }}
              - key: pxbackup/enabled
                operator: NotIn
                values:
                - "false"
              {{- end }}
      containers:
        - name: pxcentral-frontend
          image: {{ printf "%s/%s/%s:%s" (default .Values.images.pxcentralFrontendImage.registry .Values.images.registry) (default .Values.images.pxcentralFrontendImage.repo .Values.images.repo) .Values.images.pxcentralFrontendImage.imageName .Values.images.pxcentralFrontendImage.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name : http
              containerPort: 80
            - name: https
              containerPort: 443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 60
          envFrom:
            - configMapRef:
                name: pxcentral-ui-configmap
          env:
            {{- if or (empty .Values.proxy.includeNoProxyList) (has "pxcentral-frontend" .Values.proxy.includeNoProxyList) }}
            {{- include "proxy.proxyEnv" . | nindent 12 }}
            {{- end }}
          {{- include "serviceMesh.env" . | nindent 12 }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pxc-backup-secret
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pxc-backup-secret
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            - name: frontend-nginx-configs
              mountPath: /etc/nginx/conf.d
            - name: frontend-nginx-configmap
              mountPath: /etc/nginx/configmap
              readOnly: true
          {{- if .Values.proxy.configSecretName }}
            - mountPath: /etc/ssl/certs/proxy-ca.pem
              subPath: proxy-ca.pem
              name: proxy-ca-volume
              readOnly: true
          {{- end }}
          resources: {}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: frontend-nginx-configs
          emptyDir: {}
        - name: frontend-nginx-configmap
          configMap:
            name: pxcentral-frontend-nginx-config
      {{- if .Values.proxy.configSecretName }}
        - name: proxy-ca-volume
          secret:
            items:
            - key: CA
              path: proxy-ca.pem
            optional: true
            secretName: {{ .Values.proxy.configSecretName }}
      {{- end }} 
      {{- if .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- range $sec := .Values.images.pullSecrets }}
        - name: {{ $sec | quote }}
        {{- end }}
      {{- end }}
      {{- if $isOpenshiftCluster}}
      {{- else }}
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
      {{- end }}
      restartPolicy: Always
status: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pxcentral-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    run: pxcentral-frontend
    app.kubernetes.io/component: pxcentral-frontend
{{- include "px-central.labels" . | nindent 4 }}
spec:
  selector:
    run: pxcentral-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: px-central-ui
  namespace: {{ .Release.Namespace }}
  labels:
    run: pxcentral-frontend
    app.kubernetes.io/component: pxcentral-frontend
{{- include "px-central.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.service.pxCentralUIServiceAnnotations }}
    {{- include "pxcentral.render" (dict "value" .Values.service.pxCentralUIServiceAnnotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  ipFamilyPolicy: PreferDualStack
  type: {{ .Values.service.pxCentralUIServiceType }}
  selector:
    run: pxcentral-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: px-backup-ui
  namespace: {{ .Release.Namespace }}
  labels:
    run: pxcentral-frontend
    app.kubernetes.io/component: pxcentral-frontend
{{- include "px-central.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.service.pxBackupUIServiceAnnotations }}
    {{- include "pxcentral.render" (dict "value" .Values.service.pxBackupUIServiceAnnotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  ipFamilyPolicy: PreferDualStack
  type: {{ .Values.service.pxBackupUIServiceType }}
  selector:
    run: pxcentral-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
