apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "px-observability-ui.fullname" . }}-token-minter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "px-observability-ui.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "px-observability-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "px-observability-ui.fullname" . }}-token-minter
  apiGroup: rbac.authorization.k8s.io
