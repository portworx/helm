apiVersion: v1
kind: Service
metadata:
  name: {{ include "px-observability-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "px-observability-ui.labels" . | nindent 4 }}
spec:
  # Defaults to ClusterIP — on OpenShift, external access goes through the Route (route.yaml,
  # when route.enabled) instead; elsewhere set ui.service.type to NodePort/LoadBalancer as needed.
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "px-observability-ui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
